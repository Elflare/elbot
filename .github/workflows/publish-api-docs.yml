name: Publish API Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/frontend-api.openapi.yaml"
      - "docs/frontend-api/**/*.yaml"
      - ".github/workflows/publish-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Create landing repository token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.API_DOCS_APP_ID }}
          private-key: ${{ secrets.API_DOCS_APP_PRIVATE_KEY }}
          owner: Elfreese
          repositories: elbot-landing
          permission-contents: write

      - name: Trigger landing deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "Elfreese",
              repo: "elbot-landing",
              event_type: "elbot-api-spec-updated",
            });
