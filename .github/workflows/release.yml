name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "elbot${{ matrix.ext }}" ./cmd/elbot

      - name: Archive
        run: |
          mkdir -p assets
          archive="elbot-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "assets/${archive}.zip" "elbot${{ matrix.ext }}"
          else
            tar czf "assets/${archive}.tar.gz" elbot
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elbot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: assets

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect assets
        run: |
          mkdir -p release-assets
          echo "--- dist contents ---"
          ls -la dist 2>/dev/null || echo "(dist missing)"
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \; 2>/dev/null || true
          echo "--- release-assets contents ---"
          ls -la release-assets
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "ERROR: no artifacts found in dist" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum \
            | sed 's|  \./|  |' > SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME}"
          extract_section() {
            local file="$1"
            awk -v tag="$tag" '
              /^## \[/ {
                header=$0
                sub(/^## \[/, "", header)
                sub(/\].*/, "", header)
                sub(/ - .*/, "", header)
                f = (header == tag)
              }
              f { print }
            ' "$file"
          }
          zh_notes=$(extract_section CHANGELOG.md)
          if [ -z "$zh_notes" ]; then
            echo "ERROR: CHANGELOG.md has no section for ${tag}." >&2
            exit 1
          fi

          en_notes=""
          if [ -f CHANGELOG.en.md ]; then
            en_notes=$(extract_section CHANGELOG.en.md)
          fi

          if [ -z "$en_notes" ]; then
            echo "English notes for ${tag} are not in the tag; waiting for the translation on main."
            max_attempts=80
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              if git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main && \
                 git show origin/main:CHANGELOG.en.md > /tmp/CHANGELOG.en.md 2>/dev/null; then
                en_notes=$(extract_section /tmp/CHANGELOG.en.md)
                if [ -n "$en_notes" ]; then
                  echo "Found English notes for ${tag} on main."
                  break
                fi
              else
                echo "WARNING: failed to fetch English CHANGELOG from main (attempt ${attempt}/${max_attempts})." >&2
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "English notes are not ready (attempt ${attempt}/${max_attempts}); retrying in 15 seconds."
                sleep 15
              fi
            done
          fi

          if [ -z "$en_notes" ]; then
            echo "ERROR: English CHANGELOG section for ${tag} was not available after 20 minutes." >&2
            exit 1
          fi

          printf '%s\n\n---\n\n%s\n' "$zh_notes" "$en_notes" > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--notes-file release-notes.md)
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|pre) ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS \
            "${args[@]}"
