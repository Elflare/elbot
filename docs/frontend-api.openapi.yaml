openapi: 3.1.0
info:
  title: ElBot Frontend Management API
  version: 1.0.0
  description: >-
    Static contract for the management endpoints served under /api/v1. All
    successful responses are JSON. The API delegates business operations to
    Control and does not accept command text.
servers:
  - url: /api/v1
security:
  - ClientID: []
    BearerToken: []
paths:
  /sessions:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions'
  /sessions/{session_id}:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}'
  /sessions/{session_id}/messages:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1messages'
  /sessions/{session_id}/resume:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1resume'
  /sessions/{session_id}/fork:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1fork'
  /sessions/{session_id}/archive:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1archive'
  /sessions/{session_id}/unarchive:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1unarchive'
  /sessions/{session_id}/pin:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1pin'
  /sessions/{session_id}/unpin:
