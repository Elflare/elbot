  /sessions/{session_id}/compact:
    $ref: './frontend-api/paths/sessions.yaml#/~1sessions~1{session_id}~1compact'
  /session/mode:
    $ref: './frontend-api/paths/sessions.yaml#/~1session~1mode'
  /commands:
    $ref: './frontend-api/paths/runtime.yaml#/~1commands'
  /status:
    $ref: './frontend-api/paths/runtime.yaml#/~1status'
  /models:
    $ref: './frontend-api/paths/runtime.yaml#/~1models'
  /models/refresh:
    $ref: './frontend-api/paths/runtime.yaml#/~1models~1refresh'
  /models/selection:
