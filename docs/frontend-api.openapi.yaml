    $ref: './frontend-api/paths/files.yaml#/~1rollbacks'
  /rollbacks/{id}/apply:
    $ref: './frontend-api/paths/files.yaml#/~1rollbacks~1{id}~1apply'
  /files:
    $ref: './frontend-api/paths/files.yaml#/~1files'
  /files/content:
    $ref: './frontend-api/paths/files.yaml#/~1files~1content'
  /workspace:
    $ref: './frontend-api/paths/workspace.yaml#/~1workspace'
