  /logs:
    $ref: './frontend-api/paths/diagnostics.yaml#/~1logs'
  /usage:
    $ref: './frontend-api/paths/diagnostics.yaml#/~1usage'
  /configuration/check:
    $ref: './frontend-api/paths/diagnostics.yaml#/~1configuration~1check'
